<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未达回声 · 溺川夜雨</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="messages" data-zone="full">
<div class="stage">
<div class="page">

  <div class="page-head">
    <div class="crumb">未达回声 · UNREACHED ECHOES</div>
    <h1>未达回声</h1>
    <div class="sub">雨夜里只有少量短讯能够抵达。</div>
  </div>

  <p class="prose">这些消息并非完整对话，也不要求来访者留下姓名。它们更像从潮湿信号中截取的几行导航，帮助你决定先去往馆藏，还是先阅读档案。未读消息会在本地短暂发亮；刷新后，系统将记得你已经读过它们。</p>

  <div class="msg-flow" id="msgFlow"></div>

  <div class="reply-box">
    <h3 style="margin:0 0 8px;font-size:15px;color:#cfd8ec">留下你的回声</h3>
    <p style="margin:0 0 10px;font-size:12.5px;color:#8995b3">信号会穿过雨幕抵达档案深处。妃音·辞可能不会立刻回复，但会给你一段回应。</p>
    <textarea id="replyText" placeholder="写下你想留给溺川的话……"></textarea>
    <div class="emoji-row">
      <button data-emoji="ice_nod" title="嗯"><img src="emoji_ice_nod.jpg" alt="嗯"></button>
      <button data-emoji="ice_welcome" title="你来了"><img src="emoji_ice_welcome.jpg" alt="你来了"></button>
      <button data-emoji="ice_hold" title="好"><img src="emoji_ice_hold.jpg" alt="好"></button>
      <button data-emoji="ice_rain" title="今夜有雨"><img src="emoji_ice_rain.jpg" alt="今夜有雨"></button>
      <button data-emoji="ice_gn" title="晚安"><img src="emoji_ice_gn.jpg" alt="晚安"></button>
      <button data-emoji="bride_give" title="给你"><img src="emoji_bride_give.jpg" alt="给你"></button>
      <button data-emoji="bride_recv" title="收到"><img src="emoji_bride_recv.jpg" alt="收到"></button>
      <button data-emoji="bride_here" title="我在"><img src="emoji_bride_here.jpg" alt="我在"></button>
    </div>
    <button class="send-btn" id="replySend">穿过雨幕发送</button>
    <div class="reply-log" id="replyLog"></div>
  </div>

  <!-- Giscus 真实留言板：数据存在你的 GitHub Discussions 里，你能在仓库后台看到所有留言 -->
  <div class="giscus-section" style="margin-top:36px;padding-top:24px;border-top:1px solid rgba(140,170,255,0.15)">
    <h3 style="font-size:16px;color:#cfd8ec;margin-bottom:6px">真实回声墙</h3>
    <p style="font-size:12.5px;color:#8995b3;margin-bottom:16px">在这里留下的话会真正抵达妃音·辞的仓库后台（需登录 GitHub）。</p>
    <div id="giscusThread"></div>
  </div>

</div>
</div>
<script src="site-data.js"></script>
<script src="bond.js"></script>
<script src="weather.js"></script>
<script src="main.js"></script>
</body>
</html>
